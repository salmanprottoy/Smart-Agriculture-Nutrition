version: "3.8"

# Optimized for Azure B1s VM (1 vCPU, 1GB RAM)
services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: agriculture-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_agriculture_nutrition}
      POSTGRES_USER: ${POSTGRES_USER:-agriculture_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-AgriNutri2024SecurePass!}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - agriculture-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-agriculture_user} -d ${POSTGRES_DB:-smart_agriculture_nutrition}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Resource limits for Azure B1s
    mem_limit: 256m
    memswap_limit: 256m
    cpu_shares: 512
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Java Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: smart-agriculture-app:latest
    container_name: agriculture-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-smart_agriculture_nutrition}
      DB_USERNAME: ${POSTGRES_USER:-agriculture_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-AgriNutri2024SecurePass!}
      WEATHER_API_KEY: ${WEATHER_API_KEY:-your_weather_api_key}
      USDA_API_KEY: ${USDA_API_KEY:-your_usda_api_key}
      JWT_SECRET: ${JWT_SECRET:-your-secure-jwt-secret-2024}
      PORT: 8080
      APP_ENVIRONMENT: production
      # JVM memory settings optimized for Azure B1s
      JAVA_OPTS: "-Xmx384m -Xms128m -XX:MaxMetaspaceSize=128m -XX:+UseG1GC"
    ports:
      - "80:8080"
      - "8080:8080"
    networks:
      - agriculture-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8080/SmartAgricultureNutrition/",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Resource limits for Azure B1s
    mem_limit: 512m
    memswap_limit: 512m
    cpu_shares: 512
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true

networks:
  agriculture-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
    driver: local
