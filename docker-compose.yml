version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: smart-agriculture-db
    environment:
      POSTGRES_DB: smart_agriculture_nutrition
      POSTGRES_USER: agriculture_user
      POSTGRES_PASSWORD: nutrition_pass_2024
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - agriculture-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U agriculture_user -d smart_agriculture_nutrition",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Java Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: smart-agriculture-app:latest
    container_name: agriculture-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: smart_agriculture_nutrition
      DB_USERNAME: agriculture_user
      DB_PASSWORD: nutrition_pass_2024
      WEATHER_API_KEY: ${WEATHER_API_KEY:-your_weather_api_key}
      USDA_API_KEY: ${USDA_API_KEY:-your_usda_api_key}
      JWT_SECRET: ${JWT_SECRET:-your-secure-jwt-secret-2024}
      PORT: 8080
    ports:
      - "80:8080" # Access via http://localhost/
      - "8080:8080" # Access via http://localhost:8080/
    networks:
      - agriculture-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8080/SmartAgricultureNutrition/",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Database Admin Tools (Optional - for development)
  adminer:
    image: adminer:4.8.1
    container_name: smart-agriculture-adminer
    ports:
      - "8081:8080"
    networks:
      - agriculture-network
    depends_on:
      - postgres
    restart: unless-stopped
    profiles:
      - dev

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: smart-agriculture-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@agriculture.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    networks:
      - agriculture-network
    depends_on:
      - postgres
    restart: unless-stopped
    profiles:
      - dev

volumes:
  postgres_data:
    driver: local

networks:
  agriculture-network:
    driver: bridge
