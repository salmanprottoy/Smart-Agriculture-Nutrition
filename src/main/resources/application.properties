# Smart Agriculture Nutrition - Application Properties
# Database Configuration for Eclipse/Tomcat deployment

# PostgreSQL Database Configuration
# These values are for local development only
# Production values should come from environment variables
DB_HOST=${PGHOST:localhost}
DB_PORT=${PGPORT:5432}
DB_NAME=${PGDATABASE:smart_agriculture_nutrition}
DB_USERNAME=${PGUSER:agriculture_user}
DB_PASSWORD=${PGPASSWORD:nutrition_pass_2024}

# Database Connection Pool Settings
DB_MAX_POOL_SIZE=10
DB_MIN_POOL_SIZE=2
DB_CONNECTION_TIMEOUT=30000

# Application Environment
APP_ENVIRONMENT=development

# API Cache Configuration (in minutes)
WEATHER_CACHE_TTL=5
NUTRITION_CACHE_TTL=30

# External API Keys
# These should be set as environment variables, not hardcoded here
WEATHERAPI_KEY=${WEATHER_API_KEY:demo_key_replace_in_production}
USDA_API_KEY=${USDA_API_KEY:demo_key_replace_in_production}

# Feature Flags
WEATHER_INTEGRATION_ENABLED=true
NUTRITION_INTEGRATION_ENABLED=true
CORRELATION_ANALYSIS_ENABLED=true
DATABASE_INTEGRATION_ENABLED=true
CACHE_ENABLED=true

# Swagger Configuration
SWAGGER_ENABLED=true
SWAGGER_TITLE=Smart Agriculture Nutrition
SWAGGER_VERSION=1.0.0
SWAGGER_DESCRIPTION=Professional REST API integrating weather and nutrition data for agricultural analysis

# Logging
LOG_LEVEL=INFO
LOG_API_REQUESTS=true

# Development Settings
DEBUG_MODE=false
MOCK_EXTERNAL_APIS=false
ENABLE_TEST_DATA=true
