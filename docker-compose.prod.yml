services:
  # Java Application Service
  app:
    build: .
    container_name: smart-agriculture-app
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=smart_agriculture_nutrition
      - DB_USER=agriculture_user
      - DB_PASSWORD=nutrition_pass_2024
      - WEATHER_API_KEY=${WEATHER_API_KEY:-demo_key}
      - USDA_API_KEY=${USDA_API_KEY:-demo_key}
    ports:
      - "8080:8080"
    networks:
      - agriculture-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:1.25-alpine
    container_name: smart-agriculture-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/html:/var/www/html:ro
    networks:
      - agriculture-network
    depends_on:
      - app
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: smart-agriculture-db
    environment:
      POSTGRES_DB: smart_agriculture_nutrition
      POSTGRES_USER: agriculture_user
      POSTGRES_PASSWORD: nutrition_pass_2024
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - agriculture-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U agriculture_user -d smart_agriculture_nutrition",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  # pgAdmin for Database Management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: smart-agriculture-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@agriculture.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    networks:
      - agriculture-network
    depends_on:
      - postgres
    restart: unless-stopped

  # Adminer for Lightweight Database Access
  adminer:
    image: adminer:4.8.1
    container_name: smart-agriculture-adminer
    ports:
      - "8081:8080"
    networks:
      - agriculture-network
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  agriculture-network:
    driver: bridge
