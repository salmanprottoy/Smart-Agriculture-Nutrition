version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine # Use Alpine for smaller size
    container_name: agriculture-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_agriculture_nutrition}
      POSTGRES_USER: ${POSTGRES_USER:-agriculture_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-AgriNutri2024SecurePass!}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - agriculture-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-agriculture_user} -d ${POSTGRES_DB:-smart_agriculture_nutrition}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Java Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: smart-agriculture-app:latest
    container_name: agriculture-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-smart_agriculture_nutrition}
      DB_USERNAME: ${POSTGRES_USER:-agriculture_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-AgriNutri2024SecurePass!}
      WEATHER_API_KEY: ${WEATHER_API_KEY:-your_weather_api_key}
      USDA_API_KEY: ${USDA_API_KEY:-your_usda_api_key}
      JWT_SECRET: ${JWT_SECRET:-your-secure-jwt-secret-2024}
      PORT: 8080
      APP_ENVIRONMENT: production
      # JVM memory settings for container
      JAVA_OPTS: "-XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0"
    ports:
      - "80:8080" # Map external port 80 to internal port 8080
      - "8080:8080" # Direct access (optional)
    networks:
      - agriculture-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8080/SmartAgricultureNutrition/",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    # Security options
    security_opt:
      - no-new-privileges:true

networks:
  agriculture-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
    driver: local
